name: Build Plugins
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build UShop
        run: gradle clean build
      - name: Build PlayerTracker
        working-directory: PlayerTracker
        run: gradle clean build
      - name: Build CombatLog
        working-directory: CombatLog
        run: gradle clean build
      - name: Build EnchantLimit
        working-directory: EnchantLimit
        run: gradle clean build
      - name: Build TPA
        working-directory: TPA
        run: gradle clean build
      - name: Build DragonEggBuff
        working-directory: DragonEggBuff
        run: gradle clean build
      - name: Build DeathHead
        working-directory: DeathHead
        run: gradle clean build
      - name: Build VillagerTradeFix
        working-directory: VillagerTradeFix
        run: gradle clean build
      - name: Build TeamSystem
        working-directory: TeamSystem
        run: gradle clean build
      - name: Build SophisticatedBackpacks
        working-directory: SophisticatedBackpacks
        run: gradle clean build
      - name: Build NetheriteTemplate
        working-directory: NetheriteTemplate
        run: gradle clean build
      - name: Build ServerStart
        working-directory: ServerStart
        run: gradle clean build
      - name: Build SwordEnchantMix
        working-directory: SwordEnchantMix
        run: gradle clean build
      - name: Build AutoSmeltOres
        working-directory: AutoSmeltOres
        run: gradle clean build
      - name: Build CraftingKey
        working-directory: CraftingKey
        run: gradle clean build
      - name: Upload CraftingKey.jar
        uses: actions/upload-artifact@v4
        with:
          name: CraftingKey
          path: CraftingKey/build/libs/CraftingKey-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload AutoSmeltOres.jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoSmeltOres
          path: AutoSmeltOres/build/libs/AutoSmeltOres-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload SwordEnchantMix.jar
        uses: actions/upload-artifact@v4
        with:
          name: SwordEnchantMix
          path: SwordEnchantMix/build/libs/SwordEnchantMix-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload ServerStart.jar
        uses: actions/upload-artifact@v4
        with:
          name: ServerStart
          path: ServerStart/build/libs/ServerStart-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload NetheriteTemplate.jar
        uses: actions/upload-artifact@v4
        with:
          name: NetheriteTemplate
          path: NetheriteTemplate/build/libs/NetheriteTemplate-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload SophisticatedBackpacks.jar
        uses: actions/upload-artifact@v4
        with:
          name: SophisticatedBackpacks
          path: SophisticatedBackpacks/build/libs/SophisticatedBackpacks-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload TeamSystem.jar
        uses: actions/upload-artifact@v4
        with:
          name: TeamSystem
          path: TeamSystem/build/libs/TeamSystem-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload VillagerTradeFix.jar
        uses: actions/upload-artifact@v4
        with:
          name: VillagerTradeFix
          path: VillagerTradeFix/build/libs/VillagerTradeFix-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload DeathHead.jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathHead
          path: DeathHead/build/libs/DeathHead-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload DragonEggBuff.jar
        uses: actions/upload-artifact@v4
        with:
          name: DragonEggBuff
          path: DragonEggBuff/build/libs/DragonEggBuff-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload TPA.jar
        uses: actions/upload-artifact@v4
        with:
          name: TPA
          path: TPA/build/libs/TPA-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload EnchantLimit.jar
        uses: actions/upload-artifact@v4
        with:
          name: EnchantLimit
          path: EnchantLimit/build/libs/EnchantLimit-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload CombatLog.jar
        uses: actions/upload-artifact@v4
        with:
          name: CombatLog
          path: CombatLog/build/libs/CombatLog-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload UShop.jar
        uses: actions/upload-artifact@v4
        with:
          name: UShop
          path: build/libs/UShop.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload PlayerTracker.jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerTracker
          path: PlayerTracker/build/libs/PlayerTracker-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
