name: Build Plugins
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build UShop
        run: gradle clean build
      - name: Build PlayerTracker
        working-directory: PlayerTracker
        run: gradle clean build
      - name: Build CombatLog
        working-directory: CombatLog
        run: gradle clean build
      - name: Build EnchantLimit
        working-directory: EnchantLimit
        run: gradle clean build
      - name: Build TPA
        working-directory: TPA
        run: gradle clean build
      - name: Build DragonEggBuff
        working-directory: DragonEggBuff
        run: gradle clean build
      - name: Upload DragonEggBuff.jar
        uses: actions/upload-artifact@v4
        with:
          name: DragonEggBuff
          path: DragonEggBuff/build/libs/DragonEggBuff-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload TPA.jar
        uses: actions/upload-artifact@v4
        with:
          name: TPA
          path: TPA/build/libs/TPA-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload EnchantLimit.jar
        uses: actions/upload-artifact@v4
        with:
          name: EnchantLimit
          path: EnchantLimit/build/libs/EnchantLimit-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload CombatLog.jar
        uses: actions/upload-artifact@v4
        with:
          name: CombatLog
          path: CombatLog/build/libs/CombatLog-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload UShop.jar
        uses: actions/upload-artifact@v4
        with:
          name: UShop
          path: build/libs/UShop.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload PlayerTracker.jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerTracker
          path: PlayerTracker/build/libs/PlayerTracker-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
