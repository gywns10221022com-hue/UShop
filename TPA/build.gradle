plugins {
    id 'java'
}
group = 'kr.tpa'
version = '1.0.0'
repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
jar {
    archiveBaseName = 'TPA'
}
